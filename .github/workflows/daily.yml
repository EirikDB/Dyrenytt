name: Dyrenytt daglig episode

# Planlagt: hver dag kl. 05:00 UTC = 07:00 norsk sommertid (06:00 vintertid).
# Cron er ALLTID i UTC og følger ikke sommertid/vintertid. Vil du treffe 07:00
# hele året, sett "0 6 * * *" etter at vintertiden starter i slutten av oktober.
#
# Manuell kjøring (Actions -> Run workflow) er som standard en TESTKJØRING:
# den lager en lydfil du kan laste ned under kjøringen, men rører IKKE feeden
# eller Spotify. Vil du publisere en manuell kjøring, sett "publish" til true.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publiser til feed/Spotify? (false = bare testfil å lytte på)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dyrenytt
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4

      - name: Avgjør modus (publisere eller teste)
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.publish }}" = "true" ]; then
            echo "publish=1" >> "$GITHUB_OUTPUT"
            echo "Modus: PUBLISER"
          else
            echo "publish=0" >> "$GITHUB_OUTPUT"
            echo "Modus: TEST (ingen publisering)"
          fi

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Hurtigbuffer Piper-modell
        uses: actions/cache@v4
        with:
          path: model
          key: piper-no-talesyntese-medium-v1

      - name: Installer Python-avhengigheter
        run: pip install -r requirements.txt

      - name: Beregn Pages-URL
        id: site
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="${GITHUB_REPOSITORY#*/}"
          echo "base=https://${owner}.github.io/${repo}" >> "$GITHUB_OUTPUT"

      - name: Generer episode
        id: gen
        env:
          SITE_BASE: ${{ steps.site.outputs.base }}
          RELEASE_TAG: episodes
          KEEP_EPISODES: "30"
          PUBLISH: ${{ steps.mode.outputs.publish }}
          FEED_EMAIL: ${{ secrets.FEED_EMAIL }}
          # Manus (tekst): Sonnet skriver dialogen ut fra dagens nyheter.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5
          # Stemme (lyd) – prioritetsrekkefølge:
          #   1) GOOGLE_TTS_API_KEY  -> Google Cloud TTS, faste/deterministiske norske stemmer (anbefalt).
          #   2) GEMINI_API_KEY      -> Gemini TTS (generativ; stemmene kan variere litt).
          #   3) ingen               -> gratis Piper-stemme.
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          # (valgfritt) bytt stemmer: GOOGLE_VOICE_KARI / GOOGLE_VOICE_TOM
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-preview-tts
          GEMINI_MAX_CHARS: "4000"
        run: python scripts/generate.py

      # ---- Testmodus: legg lydfila som nedlastbar artefakt, ikke i feeden ----
      - name: Last opp testfil (kun testmodus)
        if: steps.mode.outputs.publish != '1'
        uses: actions/upload-artifact@v4
        with:
          name: dyrenytt-testepisode
          path: ${{ steps.gen.outputs.mp3_path }}
          retention-days: 7

      # ---- Publiseringsmodus: legg ut lyd + oppdater feed ----
      - name: Sørg for at release finnes
        if: steps.mode.outputs.publish == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view episodes >/dev/null 2>&1 || \
            gh release create episodes --title "Episoder" --notes "Lydfiler for Dyrenytt" --latest=false

      - name: Last opp lydfil til release
        if: steps.mode.outputs.publish == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload episodes "${{ steps.gen.outputs.mp3_path }}" --clobber

      - name: Rydd bort gamle lydfiler
        if: steps.mode.outputs.publish == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep=$(jq -r '.[].file' docs/episodes.json)
          for a in $(gh release view episodes --json assets -q '.assets[].name'); do
            if ! echo "$keep" | grep -qx "$a"; then
              echo "Sletter gammel asset: $a"
              gh release delete-asset episodes "$a" -y || true
            fi
          done

      - name: Publiser feed til Pages (commit docs/)
        if: steps.mode.outputs.publish == '1'
        run: |
          git config user.name "dyrenytt-bot"
          git config user.email "dyrenytt-bot@users.noreply.github.com"
          git add docs/feed.xml docs/episodes.json docs/seen.json
          if git diff --cached --quiet; then
            echo "Ingen endringer å committe."
          else
            git commit -m "Episode ${{ github.run_id }}"
            git push
          fi
