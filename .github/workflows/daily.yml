name: Dyrenytt daglig episode

# Flere planlagte forsøk om morgenen (UTC) fordi GitHubs cron er upålitelig og
# ofte forsinker/hopper kjøringer. Den første som lander lager dagens episode; de
# andre ser at den finnes og avslutter. Cron følger ikke sommertid – juster ved behov.
#
# Manuell kjøring (Actions -> Run workflow) er som standard en TESTKJØRING:
# den lager en lydfil du kan laste ned under kjøringen, men rører IKKE feeden
# eller Spotify. Vil du publisere en manuell kjøring, sett "publish" til true.
on:
  schedule:
    # GitHubs cron er «best effort» og hopper/forsinker ofte kjøringer. Derfor flere
    # forsøk om morgenen (UTC). Den FØRSTE som lander lager episoden; resten oppdager at
    # dagens episode alt finnes og avslutter uten å bruke API-kall (se "skip" under).
    - cron: "23 0 * * *"   # 02:23 norsk sommertid (første forsøk)
    - cron: "23 1 * * *"   # 03:23
    - cron: "23 2 * * *"   # 04:23
    - cron: "23 3 * * *"   # 05:23
  workflow_dispatch:
    inputs:
      publish:
        description: "Publiser til feed/Spotify? (false = bare testfil å lytte på)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dyrenytt
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4

      - name: Avgjør modus (publisere eller teste)
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.publish }}" = "true" ]; then
            echo "publish=1" >> "$GITHUB_OUTPUT"
            echo "Modus: PUBLISER"
          else
            echo "publish=0" >> "$GITHUB_OUTPUT"
            echo "Modus: TEST (ingen publisering)"
          fi
          # Hopp over hvis dagens episode ALLEREDE finnes (kun for planlagte kjøringer),
          # slik at ekstra/forsinkede cron-treff ikke lager en ny episode eller koster API-kall.
          skip=0
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f docs/episodes.json ]; then
            today=$(TZ='Europe/Oslo' date +%F)
            if jq -e --arg d "$today" 'any(.[]; .date==$d)' docs/episodes.json >/dev/null 2>&1; then
              skip=1
              echo "Dagens episode ($today) finnes allerede – hopper over denne kjøringen."
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Hurtigbuffer Piper-modell
        uses: actions/cache@v4
        with:
          path: model
          key: piper-no-talesyntese-medium-v1

      - name: Installer Python-avhengigheter
        run: pip install -r requirements.txt

      - name: Beregn Pages-URL
        id: site
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="${GITHUB_REPOSITORY#*/}"
          echo "base=https://${owner}.github.io/${repo}" >> "$GITHUB_OUTPUT"

      - name: Generer episode
        id: gen
        if: steps.mode.outputs.skip != '1'
        env:
          SITE_BASE: ${{ steps.site.outputs.base }}
          RELEASE_TAG: episodes
          KEEP_EPISODES: "30"
          PUBLISH: ${{ steps.mode.outputs.publish }}
          FEED_EMAIL: ${{ secrets.FEED_EMAIL }}
          # Egne RSS-kilder (PRIMÆRKILDE for dyre-delen). URL-er i secret RSS_FEEDS,
          # flere skilt med komma/linjeskift. Google brukes da bare som EU/intl-supplement.
          RSS_FEEDS: ${{ secrets.RSS_FEEDS }}
          RSS_MAX_AGE_DAYS: "7"
          # FEED_ONLY=1 = kun feeden, ingen Google i det hele tatt for dyre-delen.
          FEED_ONLY: "0"
          # Manus (tekst): Sonnet skriver dialogen ut fra dagens nyheter.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5
          # Stemme (lyd) – TTS_ENGINE overstyrer; ellers prioritet:
          #   eleven (ELEVENLABS_API_KEY) > google (GOOGLE_TTS_API_KEY) > gemini > piper.
          # Sett TTS_ENGINE til eleven/google/gemini/piper for å velge eksplisitt (tomt = auto).
          TTS_ENGINE: "eleven"
          # ElevenLabs – faste, deterministiske stemmer (norsk via eleven_multilingual_v2).
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Stemmer (voice-IDer fra ElevenLabs – ikke hemmelig, limt inn direkte):
          ELEVEN_VOICE_KARI: "uNsWM1StCcpydKYOjKyu"   # Mia Starset (kvinne)
          ELEVEN_VOICE_TOM: "580zXINOKYzlp5JwzW2H"    # Henrik (mann)
          # Språk LÅST til norsk (krever flash/v3-modell; multilingual_v2 støtter ikke språklås).
          # Dialekt = stemmens egen (Mia/Henrik).
          ELEVEN_MODEL: "eleven_flash_v2_5"
          ELEVEN_LANGUAGE: "no"
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          # (valgfritt) bytt stemmer: GOOGLE_VOICE_KARI / GOOGLE_VOICE_TOM
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-preview-tts
          GEMINI_MAX_CHARS: "4000"
        run: python scripts/generate.py

      # ---- Testmodus: legg lydfila som nedlastbar artefakt, ikke i feeden ----
      - name: Last opp testfil (kun testmodus)
        if: steps.mode.outputs.publish != '1' && steps.mode.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: dyrenytt-testepisode
          path: ${{ steps.gen.outputs.mp3_path }}
          retention-days: 7

      # ---- Publiseringsmodus: legg ut lyd + oppdater feed ----
      - name: Sørg for at release finnes
        if: steps.mode.outputs.publish == '1' && steps.mode.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view episodes >/dev/null 2>&1 || \
            gh release create episodes --title "Episoder" --notes "Lydfiler for Dyrenytt" --latest=false

      - name: Last opp lydfil til release
        if: steps.mode.outputs.publish == '1' && steps.mode.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload episodes "${{ steps.gen.outputs.mp3_path }}" --clobber

      - name: Rydd bort gamle lydfiler
        if: steps.mode.outputs.publish == '1' && steps.mode.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep=$(jq -r '.[].file' docs/episodes.json)
          for a in $(gh release view episodes --json assets -q '.assets[].name'); do
            if ! echo "$keep" | grep -qx "$a"; then
              echo "Sletter gammel asset: $a"
              gh release delete-asset episodes "$a" -y || true
            fi
          done

      - name: Publiser feed til Pages (commit docs/)
        if: steps.mode.outputs.publish == '1' && steps.mode.outputs.skip != '1'
        run: |
          git config user.name "dyrenytt-bot"
          git config user.email "dyrenytt-bot@users.noreply.github.com"
          git add docs/feed.xml docs/episodes.json docs/seen.json
          if git diff --cached --quiet; then
            echo "Ingen endringer å committe."
          else
            git commit -m "Episode ${{ github.run_id }}"
            git push
          fi
